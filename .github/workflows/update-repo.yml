name: Build and Host ArtCraft Flatpak Repo

on:
  schedule:
    - cron: '0 6 * * *' # Esegue ogni mattina alle 06:00 UTC
  workflow_dispatch:    # Permette l'avvio manuale dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Installa dipendenze Flatpak e OSTree
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree curl jq

      - name: Inizializza repository OSTree
        run: |
          mkdir -p repo
          ostree init --mode=archive-z2 --repo=repo
          echo "artcraft.p4rzl.it" > repo/CNAME
          touch repo/.nojekyll

          # Configurazione per Flatpak e Discover senza firma GPG
          cat << 'EOF' > repo/artcraft.flatpakrepo
[Flatpak Repo]
Title=ArtCraft
Url=https://artcraft.p4rzl.it/
Homepage=https://github.com/storytold
Comment=Unofficial Flatpak mirror for ArtCraft suite
Description=Unofficial Flatpak repository for ArtCraft suite
DefaultBranch=stable
gpg-verify=false
EOF

      - name: Scarica e importa i bundle di tutte le app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS=(
            "storytold/photocraft"
            "storytold/vectorcraft"
            "storytold/filmcraft"
            "storytold/lightcraft"
            "storytold/pdfcraft"
            "storytold/effectcraft"
            "storytold/designcraft"
          )

          IMPORTED_COUNT=0

          for repo in "${REPOS[@]}"; do
            echo "=========================================="
            echo "Controllo release per: $repo"
            echo "=========================================="

            RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/releases/latest")

            # Cerca x86_64 o amd64 (case-insensitive) gestendo in sicurezza asset nulli
            BUNDLE_URL=$(echo "$RELEASE_JSON" | jq -r '(.assets // [])[] | select(.name | endswith(".flatpak")) | select(.name | test("x86_64|x86-64|amd64"; "i")) | .browser_download_url' | head -n 1)

            # Fallback: primo .flatpak disponibile escludendo architetture ARM
            if [ -z "$BUNDLE_URL" ] || [ "$BUNDLE_URL" = "null" ]; then
              BUNDLE_URL=$(echo "$RELEASE_JSON" | jq -r '(.assets // [])[] | select(.name | endswith(".flatpak")) | select(.name | test("aarch64|arm64|armv7"; "i") | not) | .browser_download_url' | head -n 1)
            fi

            if [ -z "$BUNDLE_URL" ] || [ "$BUNDLE_URL" = "null" ]; then
              echo "Nessun bundle .flatpak compatibile trovato per $repo. Salto..."
              continue
            fi

            echo "Download: $BUNDLE_URL"
            if ! curl -sSfL -o app.flatpak "$BUNDLE_URL"; then
              echo "Errore nel download di $BUNDLE_URL. Salto..."
              rm -f app.flatpak
              continue
            fi

            echo "Importazione in OSTree..."
            if flatpak build-import-bundle repo app.flatpak; then
              IMPORTED_COUNT=$((IMPORTED_COUNT + 1))
            else
              echo "Errore durante l'importazione del bundle di $repo. Salto..."
            fi
            
            rm -f app.flatpak
          done

          echo "=========================================="
          echo "Totale pacchetti importati: $IMPORTED_COUNT"
          echo "=========================================="

          if [ "$IMPORTED_COUNT" -eq 0 ]; then
            echo "Errore critico: nessun pacchetto importato nel repository."
            exit 1
          fi

      - name: Genera indice e metadati del repository
        run: |
          flatpak build-update-repo --generate-static-deltas repo

      - name: Carica artefatto per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-repo
    steps:
      - name: Distribuisci su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
