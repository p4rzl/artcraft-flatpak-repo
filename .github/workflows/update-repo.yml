
name: Build and Host ArtCraft Flatpak Repo

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-repo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-repo:
    name: Build Flatpak Repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            ostree \
            curl \
            jq \
            python3

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Initialize OSTree repository
        run: |
          set -euo pipefail

          mkdir -p repo

          ostree init \
            --repo=repo \
            --mode=archive-z2

          echo "artcraft.p4rzl.it" > repo/CNAME
          touch repo/.nojekyll

          printf '%s\n' \
            '[Flatpak Repo]' \
            'Title=ArtCraft' \
            'Url=https://artcraft.p4rzl.it/' \
            'Homepage=https://github.com/storytold' \
            'Comment=Unofficial ArtCraft Flatpak repository' \
            'Description=Community-maintained ArtCraft repository' \
            'GPGVerify=false' \
            > repo/artcraft.flatpakrepo

      - name: Download and import Flatpak bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPOS=(
            "storytold/photocraft"
            "storytold/vectorcraft"
            "storytold/filmcraft"
            "storytold/lightcraft"
            "storytold/pdfcraft"
            "storytold/effectcraft"
            "storytold/designcraft"
          )

          IMPORTED=0
          FAILED=0

          mkdir -p downloads

          for project in "${REPOS[@]}"; do
            echo "::group::Processing $project"

            echo "Checking latest release..."

            if ! curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$project/releases/latest" \
              -o release.json; then

              echo "::warning::Cannot fetch release for $project"
              FAILED=$((FAILED + 1))
              echo "::endgroup::"
              continue
            fi

            TAG=$(jq -r '.tag_name // "unknown"' release.json)

            echo "Latest release: $TAG"

            BUNDLE_URL=$(jq -r '
              (.assets // [])[]
              | select(
                  .name
                  | test("x86_64|x86-64|amd64"; "i")
                )
              | select(
                  .name
                  | endswith(".flatpak")
                )
              | .browser_download_url
            ' release.json | head -n 1)

            if [[ -z "$BUNDLE_URL" ]]; then
              echo "::warning::No x86_64 Flatpak for $project"
              FAILED=$((FAILED + 1))
              echo "::endgroup::"
              continue
            fi

            BUNDLE="downloads/$(basename "$BUNDLE_URL")"

            echo "Downloading $BUNDLE"

            if ! curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --output "$BUNDLE" \
              "$BUNDLE_URL"; then

              echo "::warning::Download failed for $project"
              FAILED=$((FAILED + 1))
              rm -f "$BUNDLE"
              echo "::endgroup::"
              continue
            fi

            echo "Importing Flatpak bundle..."

            if flatpak build-import-bundle \
              --update-appstream \
              repo \
              "$BUNDLE"; then

              IMPORTED=$((IMPORTED + 1))
              echo "Successfully imported $project"
            else
              echo "::warning::Import failed for $project"
              FAILED=$((FAILED + 1))
            fi

            rm -f "$BUNDLE"

            echo "::endgroup::"
          done

          echo "Imported: $IMPORTED"
          echo "Failed: $FAILED"

          echo "## ArtCraft Flatpak Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imported applications: $IMPORTED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed applications: $FAILED" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$IMPORTED" -eq 0 ]]; then
            echo "::error::No Flatpak bundles imported"
            exit 1
          fi

          if [[ "$FAILED" -gt 0 ]]; then
            echo "::error::Some applications failed to import"
            exit 1
          fi

      - name: Generate repository metadata
        run: |
          set -euo pipefail

          flatpak build-update-repo repo

          echo "Checking repository references..."

          ostree refs --repo=repo

          echo "Checking repository summary..."

          test -s repo/summary

          echo "Repository metadata generated successfully."

      - name: Validate runtimes and generate installation links
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/artcraft-runtime-check
        run: |
          set -euo pipefail

          # Use a clean installation so preinstalled runtimes cannot hide errors.
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

          python3 <<'PY'
          import configparser
          import os
          import re
          import subprocess
          from pathlib import Path

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          refs = sorted(ref for ref in output("ostree", "refs", "--repo=repo").splitlines()
                        if ref.startswith("app/"))
          if len(refs) != 7:
              raise SystemExit("Expected exactly seven application refs")

          expected = {"ai.storyteller." + name for name in (
              "photocraft", "vectorcraft", "filmcraft", "lightcraft",
              "pdfcraft", "effectcraft", "designcraft")}
          found = set()
          checked = set()
          report = ["", "## Runtime availability", "",
                    "| Application | Required runtime |", "|---|---|"]
          for ref in refs:
              _, app_id, arch, branch = ref.split("/")
              if app_id not in expected or arch != "x86_64" or branch != "stable":
                  raise SystemExit(f"Unexpected application ref: {ref}")
              found.add(app_id)
              metadata = configparser.ConfigParser(interpolation=None)
              metadata.read_string(output("ostree", "cat", "--repo=repo", ref, "/metadata"))
              runtime = metadata.get("Application", "runtime")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/x86_64/[A-Za-z0-9_.-]+", runtime):
                  raise SystemExit(f"Invalid runtime for {ref}: {runtime!r}")
              if runtime not in checked:
                  # Full ref: check the exact architecture AND branch on stable Flathub.
                  result = subprocess.run([
                      "flatpak", "remote-info", "--user", "--show-ref",
                      "flathub", "runtime/" + runtime,
                  ], text=True, capture_output=True)
                  if result.returncode or result.stdout.strip() != "runtime/" + runtime:
                      print(result.stderr)
                      raise SystemExit(
                          f"{app_id} requires {runtime}, which could not be verified on Flathub. "
                          "Publication blocked; the previous deployment remains online. "
                          "Do not change the runtime version in prebuilt bundles.")
                  checked.add(runtime)
              report.append(f"| {app_id} | {runtime} |")
              # RuntimeRepo is supported by .flatpakref, not .flatpakrepo.
              # Installing this file can offer to add Flathub for missing runtimes.
              Path(f"repo/{app_id}.flatpakref").write_text(
                  "[Flatpak Ref]\n"
                  f"Name={app_id}\nBranch={branch}\n"
                  "Title=ArtCraft\n"
                  "Url=https://artcraft.p4rzl.it/\n"
                  "IsRuntime=false\n"
                  "SuggestRemoteName=artcraft\n"
                  "RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo\n",
                  encoding="utf-8")
          if found != expected:
              raise SystemExit("The repository does not contain all seven expected applications")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(report) + "\n")
          PY

      - name: Verify repository contents
        run: |
          set -euo pipefail

          test -f repo/config
          test -s repo/summary
          test -f repo/artcraft.flatpakrepo
          test -f repo/CNAME

          COUNT=$(ostree refs --repo=repo | grep -c '^app/' || true)

          echo "Application refs: $COUNT"

          if [[ "$COUNT" -lt 7 ]]; then
            echo "::error::Expected 7 application refs"
            exit 1
          fi

          du -sh repo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  deploy:
    name: Deploy Flatpak Repository
    runs-on: ubuntu-latest
    needs: build-repo

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

